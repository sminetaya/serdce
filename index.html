<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Мой первый сайт</title>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Bad+Script&family=Comfortaa&family=Cormorant+Garamond&family=Lobster&family=Marck+Script&family=Parisienne&family=Poiret+One&family=Sacramento&family=Satisfy&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="stars"></div>

    <h1>хэй!! у меня есть маленький подарочек для тебя, муа♡♡</h1>

    <button id="firstBtn" onclick="showHeart()">нажми на меня</button>

    <button id="secondHeartBtn" class="corner-btn right-btn">далее♡</button>
    <button id="backBtn" class="corner-btn left-btn hidden">← обратно♡</button>
    <button id="thirdBtn" class="corner-btn bottom-btn hidden">дальшее♡</button>

    <canvas id="secondHeart" class="second-heart hidden"></canvas>
   <div id="thirdPage" class="hidden">
    <div class="third-card">
        <h1>а вот и еще один подарочек ♡</h1>

        <p id="typedText"></p>

        <button id="finalHeartBtn">нажми еще раз ♡</button>
        <div id="finalMessage" class="hidden">я тебя люблю ♡</div>
    </div>

    <div id="fallingHearts"></div>

    <button id="backToSecondBtn" class="corner-btn left-btn">← обратно♡</button>
</div>

    <p id="message"></p>

    <div class="heart" id="heart"></div>

    <script src="script.js"></script>
</body>
</html>
